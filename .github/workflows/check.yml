name: Build and checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          for f in runtime/*.sh tests/*.sh; do sh -n "$f"; done
          sh tests/test-ipv6.sh
          sh tests/test-interval.sh
  android:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - shell: pwsh
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - shell: pwsh
        run: ./app/build.ps1
      - shell: pwsh
        run: |
          javac -d app/build/tests app/src/com/mcyao/ddnspanel/ReleaseArchive.java tests/ReleaseArchiveTest.java
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          java -cp app/build/tests ReleaseArchiveTest
      - uses: actions/upload-artifact@v4
        with:
          name: ddns-go-assistant-test-apk
          path: app/out/ddns-go-assistant-debug.apk
          retention-days: 14
  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [scripts, android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Publish a prepared signed release after checks pass
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(python3 -c 'import xml.etree.ElementTree as E; print(E.parse("app/AndroidManifest.xml").getroot().attrib["{http://schemas.android.com/apk/res/android}versionName"])')
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          directory="releases/v$version"
          if [ ! -f "$directory/SHA256SUMS" ]; then echo 'No prepared release for this version.'; exit 0; fi
          (cd "$directory" && sha256sum --check SHA256SUMS)
          if gh release view "v$version" >/dev/null 2>&1; then echo 'Release already exists; leaving it unchanged.'; exit 0; fi
          gh release create "v$version" --target "$GITHUB_SHA" --title "ddns-go Assistant v$version" \
            --notes-file "$directory/NOTES.md" "$directory/ddns-go-assistant.apk" "$directory/SHA256SUMS"
